<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Manrope:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px}
body{font-family:'Sarabun',Arial,sans-serif;position:relative;overflow:hidden;background:#000;color:#fff}
body.claro{background:#F6F6F6;color:#000}
body.amarillo{background:#E8C223;color:#000}
.top{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.top img{height:46px}
.kicker{font-family:'Manrope',sans-serif;font-size:23px;letter-spacing:.16em;text-transform:uppercase;color:#808285}
.kicker b{font-weight:500;color:#E8C223}
.claro .kicker b,.amarillo .kicker b{color:#000}
.amarillo .kicker{color:#000}
.foto-top .kicker{color:#fff}
.pie{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.pie .logo{width:230px}
.sig{display:flex;align-items:center;gap:22px;font-family:'Manrope',sans-serif;font-size:24px;letter-spacing:.14em;color:#808285}
.amarillo .sig{color:#000}
.flecha{width:84px;height:84px;border-radius:50%;background:#E8C223;display:flex;align-items:center;justify-content:center}
.amarillo .flecha{background:#000}
.flecha svg{width:40px;height:40px;stroke:#000;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.amarillo .flecha svg{stroke:#E8C223}
.zona{position:absolute;left:80px;right:80px;top:180px;bottom:170px;z-index:2}

/* globos de conversacion */
.globo{display:inline-block;border-radius:64px;padding:54px 72px 62px}
.globo.cliente{background:#E8C223;color:#000;border-bottom-left-radius:10px}
.globo.yo{border:4px solid #808285;color:#808285;border-bottom-right-radius:10px}
.fila{display:flex}
.fila.der{justify-content:flex-end}
.puntos{display:flex;gap:18px;padding:6px 4px}
.puntos i{width:26px;height:26px;border-radius:50%;background:#808285;display:block}
.puntos i:nth-child(2){opacity:.65}.puntos i:nth-child(3){opacity:.35}
</style></head><body class="amarillo"><div class="top"><img src="icono_negro_t.png" alt=""><div class="kicker"><b>Viernes 25 sep</b> · Cámara de Granada</div></div><div class="zona">
<style>
.h3{font-size:126px;line-height:.96;font-weight:600;letter-spacing:-.02em;margin-top:10px}
.s3{margin-top:40px;font-size:60px;line-height:1.12;font-weight:600}
.resp{margin-top:56px}
.resp .globo{background:#000;border-radius:48px;border-bottom-right-radius:10px;padding:46px 54px;width:680px}
.resp .barra{height:18px;border-radius:9px;background:#E8C223;margin:16px 0}
.resp .barra:nth-child(2){width:82%}.resp .barra:nth-child(3){width:58%}
.p3{margin-top:56px;font-size:46px;line-height:1.28;font-weight:500}
</style>
<p class="h3">Hay una tercera respuesta.</p>
<p class="s3">Mantienes el precio y cierras la venta.</p>
<div class="fila der resp"><div class="globo"><div class="barra"></div><div class="barra"></div><div class="barra"></div></div></div>
<p class="p3">Esa respuesta no se improvisa delante del cliente. Se lleva preparada, y sale de los números de tu empresa.</p>
</div><div class="pie"><div class="kicker">Tu Sistema de Precios · <b>taller presencial</b></div><div class="sig">3/9<div class="flecha"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div></div></div></body></html>
