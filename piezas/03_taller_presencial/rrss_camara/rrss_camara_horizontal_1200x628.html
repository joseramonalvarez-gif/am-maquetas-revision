<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=Manrope:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:628px;background:#000}
body{font-family:'Sarabun',Arial,sans-serif;color:#fff;position:relative;overflow:hidden}
.barra{position:absolute;left:0;top:0;bottom:0;width:24px;background:#E8C223}
.in{position:absolute;left:78px;right:50px;top:50px;bottom:50px;display:flex;flex-direction:column}
.kicker{font-family:'Manrope',sans-serif;font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:#E8C223}
h1{font-size:76px;line-height:1.05;font-weight:600;margin-top:20px;letter-spacing:-.01em}
.raya{width:110px;height:7px;background:#E8C223;margin:20px 0}
.sub{font-size:29px;line-height:1.3;color:#DADADA}
.datos{margin-top:auto;margin-bottom:0px}
.kicker i{font-style:normal}
.kicker i.sep{display:inline}
.kicker i.salto{display:none}
.fecha{font-size:34px;font-weight:600;line-height:1.15}
.lugar{font-size:24px;color:#DADADA;margin-top:8px}
.chip{display:inline-block;margin-top:20px;background:#E8C223;color:#000;font-weight:600;font-size:19px;letter-spacing:.1em;text-transform:uppercase;padding:11px 18px;border-radius:8px}
.logo{position:absolute;right:50px;bottom:50px;width:190px}
</style></head><body>
<div class="barra"></div>
<div class="in">
  <div class="kicker">Última convocatoria en Granada<i class="sep"> · </i><i class="salto"></i>Taller presencial de pricing</div>
  <h1>Tu Sistema de Precios</h1>
  <div class="raya"></div>
  <p class="sub">Sube tus precios con método.<br>Vende más y con más margen.</p>
  <div class="datos">
    <div class="fecha">Viernes 25 de septiembre · 9:00 a 14:00</div>
    <div class="lugar">Cámara de Comercio de Granada · 25 plazas</div>
    <div class="chip">Socios de Club Cámara: condiciones exclusivas</div>
  </div>
</div>
<img class="logo" src="logotipo_blanco.png" alt="Nevada &amp; Amurai · Consultores y Abogados">
</body></html>
